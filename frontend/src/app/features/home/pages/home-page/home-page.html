<section class="max-w-7xl mx-auto px-4 py-10">
    <div class="mb-10">

        <h1 class="text-5xl md:text-7xl font-bold leading-tight max-w-3xl">
            Elevate Your Tennis Game
        </h1>

        <p class="text-gray-500 mt-4 text-lg max-w-xl">
            Discover premium tennis rackets built for performance, control and power.
        </p>

    </div>

    @if (isLoading()) {
    <div class="text-center py-20">
        Loading products...
    </div>
    }

    @if (error()) {
    <div class="text-center text-red-500 py-20">
        {{ error() }}
    </div>
    }

    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">

        @for (
        racket of rackets();
        track racket.id
        ) {

        <app-product-card [racket]="racket">
        </app-product-card>

        }

    </div>
</section>
