<div class="fixed top-5 right-5 z-[9999] space-y-3">

    @for (toast of toastService.toasts(); track toast.id) {

    <div class="min-w-[280px] max-w-sm rounded-2xl shadow-lg px-5 py-4 text-white animate-slide-in"
        [class.bg-green-600]="toast.type === 'success'" [class.bg-red-600]="toast.type === 'error'"
        [class.bg-slate-800]="toast.type === 'info'">

        {{ toast.message }}

    </div>

    }

</div>
