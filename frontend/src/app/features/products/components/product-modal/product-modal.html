<div class="fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4" (click)="closeModal()">

    <div class="bg-white rounded-3xl max-w-4xl w-full overflow-hidden shadow-2xl relative animate-fade-in"
        (click)="$event.stopPropagation()">

        <button (click)="closeModal()"
            class="absolute top-5 right-5 w-10 h-10 rounded-full bg-slate-100 hover:bg-slate-200 transition text-xl font-bold z-10">
            ✕
        </button>

        <div class="grid md:grid-cols-2">

            <div class="bg-slate-100 flex items-center justify-center p-8">
                <img [src]="racket.image" [alt]="racket.name" class="max-h-[420px] object-contain">
            </div>

            <div class="p-8">

                <p class="text-green-700 font-semibold">
                    {{ racket.brand }}
                </p>

                <h2 class="text-3xl font-bold mt-2">
                    {{ racket.name }}
                </h2>

                <p class="text-gray-600 mt-4">
                    {{ racket.description }}
                </p>

                <div class="grid grid-cols-2 gap-4 mt-8">

                    <div class="bg-slate-100 rounded-xl p-4">
                        <p class="text-sm text-gray-500">Weight</p>
                        <p class="font-bold">{{ racket.weight }}</p>
                    </div>

                    <div class="bg-slate-100 rounded-xl p-4">
                        <p class="text-sm text-gray-500">Balance</p>
                        <p class="font-bold">{{ racket.balance }}</p>
                    </div>

                    <div class="bg-slate-100 rounded-xl p-4">
                        <p class="text-sm text-gray-500">Head Size</p>
                        <p class="font-bold">{{ racket.headSize }}</p>
                    </div>

                    <div class="bg-slate-100 rounded-xl p-4">
                        <p class="text-sm text-gray-500">Pattern</p>
                        <p class="font-bold">{{ racket.stringPattern }}</p>
                    </div>

                    <div class="bg-slate-100 rounded-xl p-4 col-span-2">
                        <p class="text-sm text-gray-500">Player Level</p>
                        <p class="font-bold">{{ racket.level }}</p>
                    </div>

                </div>

                <div class="flex items-center justify-between mt-8">

                    <div>
                        <p class="text-sm text-gray-500">Price</p>
                        <p class="text-3xl font-bold text-green-700">
                            {{ racket.price | currency:'COP' }}
                        </p>
                    </div>

                    <button (click)="addToCart()"
                        class="bg-slate-900 text-white px-6 py-3 rounded-xl hover:opacity-90 transition">
                        Add to cart
                    </button>

                </div>

            </div>

        </div>

    </div>

</div>
