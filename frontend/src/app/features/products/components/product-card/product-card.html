<div
    class="bg-white  rounded-2xl  overflow-hidden  shadow-md  hover:shadow-xl  transition  duration-300  hover:-translate-y-1">

    <img [src]="racket.image" [alt]="racket.name" class="w-full h-64 object-cover" />
    <div class="p-5">
        <p class="text-sm text-gray-500">
            {{ racket.brand }}
        </p>
        <h2 class="text-xl font-bold mt-1">
            {{ racket.name }}
        </h2>
        <p class="text-gray-600 text-sm mt-2">
            {{ racket.description }}
        </p>
        <div class="flex justify-between items-center mt-5">
            <span class=" text-2xl font-bold text-green-700">
                {{ racket.price | currency:'COP' }}
            </span>
            <button (click)="addToCart()"
                class="bg-slate-900  text-white  px-4  py-2  rounded-xl  hover:opacity-90  transition">
                Add to cart
            </button>
        </div>
    </div>
</div>
